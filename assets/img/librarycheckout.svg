<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="glowLC" cx="25%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#3b1706"/>
      <stop offset="55%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#glowLC)"/>

  <!-- Shelf of book spines -->
  <g>
    <line x1="130" y1="252" x2="440" y2="252" stroke="#3a4356" stroke-width="4" stroke-linecap="round"/>
    <rect x="146" y="98" width="34" height="152" rx="4" fill="#f97316" opacity="0.9"/>
    <rect x="188" y="120" width="30" height="130" rx="4" fill="#1f2430" stroke="#3a4356" stroke-width="2"/>
    <rect x="226" y="86" width="38" height="164" rx="4" fill="#fdba74" opacity="0.85"/>
    <!-- leaning book -->
    <g transform="translate(292,250) rotate(-12)">
      <rect x="0" y="-150" width="32" height="150" rx="4" fill="#1f2430" stroke="#f97316" stroke-width="2"/>
    </g>
    <rect x="342" y="108" width="30" height="142" rx="4" fill="#1f2430" stroke="#3a4356" stroke-width="2"/>
    <rect x="380" y="92" width="36" height="158" rx="4" fill="#f97316" opacity="0.55"/>
    <!-- spine detail lines -->
    <g stroke="#0c1220" stroke-width="2" opacity="0.6">
      <line x1="152" y1="120" x2="174" y2="120"/>
      <line x1="152" y1="130" x2="174" y2="130"/>
      <line x1="232" y1="108" x2="258" y2="108"/>
      <line x1="232" y1="118" x2="258" y2="118"/>
      <line x1="386" y1="114" x2="410" y2="114"/>
    </g>
  </g>

  <!-- Checkout card -->
  <g transform="translate(478,88)">
    <rect x="0" y="0" width="196" height="164" rx="10" fill="#f8f1e4"/>
    <rect x="0" y="0" width="196" height="34" rx="10" fill="#f97316"/>
    <rect x="0" y="20" width="196" height="14" fill="#f97316"/>
    <text x="98" y="23" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#fff7ed">CHECKOUT CARD</text>
    <g font-family="Poppins, Arial, sans-serif" font-size="11" fill="#57534e">
      <text x="14" y="58">DUE DATE</text>
      <text x="112" y="58">MEMBER</text>
    </g>
    <g stroke="#d6c9b2" stroke-width="1.5">
      <line x1="14" y1="76" x2="182" y2="76"/>
      <line x1="14" y1="102" x2="182" y2="102"/>
      <line x1="14" y1="128" x2="182" y2="128"/>
    </g>
    <g font-family="Poppins, Arial, sans-serif" font-size="12" fill="#44403c">
      <text x="14" y="72">JUL 28</text>
      <text x="112" y="72">M. Reyes</text>
      <text x="14" y="98">AUG 04</text>
      <text x="112" y="98">T. Okafor</text>
    </g>
    <!-- overdue stamp -->
    <g transform="translate(96,116) rotate(-8)">
      <rect x="0" y="0" width="88" height="26" rx="5" fill="none" stroke="#dc2626" stroke-width="2.5"/>
      <text x="44" y="18" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#dc2626">OVERDUE</text>
    </g>
  </g>

  <text x="400" y="330" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff">Library Checkout System</text>
  <text x="400" y="375" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#fdba74">EVERY COPY ACCOUNTED FOR</text>
  <text x="400" y="415" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#94a3b8">Catalog, circulation rules &amp; overdue reports &#8212; ASP.NET Core Razor Pages</text>
</svg>
