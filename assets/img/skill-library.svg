<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="glowSK" cx="25%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#100e22"/>
      <stop offset="100%" stop-color="#06050d"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#glowSK)"/>

  <!-- Stack of skill cards -->
  <g>
    <rect x="130" y="130" width="230" height="130" rx="12" fill="none" stroke="#3a4356" stroke-width="2" transform="rotate(-6 245 195)"/>
    <rect x="150" y="110" width="230" height="130" rx="12" fill="none" stroke="#3a4356" stroke-width="2" transform="rotate(-3 265 175)"/>
    <rect x="170" y="90" width="230" height="130" rx="12" fill="#1f2430" stroke="#a78bfa" stroke-width="2"/>
    <!-- top card: title bar + prompt lines -->
    <line x1="170" y1="124" x2="400" y2="124" stroke="#a78bfa" stroke-width="2"/>
    <g font-family="Poppins, Arial, sans-serif" font-size="14" fill="#c4b5fd">
      <text x="186" y="113">overseer.md</text>
    </g>
    <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
      <line x1="188" y1="146" x2="382" y2="146"/>
      <line x1="188" y1="168" x2="350" y2="168"/>
      <line x1="188" y1="190" x2="368" y2="190"/>
    </g>
  </g>

  <!-- Heartbeat pulse from the card stack to the workers -->
  <path d="M400 155 h48 l10 -22 14 44 12 -22 h40" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Worker agents (three bots) -->
  <g transform="translate(548,86)">
    <g fill="#1f2430" stroke="#3a4356" stroke-width="2">
      <rect x="0" y="30" width="58" height="46" rx="10"/>
      <rect x="78" y="0" width="58" height="46" rx="10"/>
      <rect x="78" y="66" width="58" height="46" rx="10"/>
    </g>
    <g fill="#a78bfa">
      <circle cx="18" cy="53" r="5"/><circle cx="40" cy="53" r="5"/>
      <circle cx="96" cy="23" r="5"/><circle cx="118" cy="23" r="5"/>
      <circle cx="96" cy="89" r="5"/><circle cx="118" cy="89" r="5"/>
    </g>
    <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
      <line x1="29" y1="30" x2="29" y2="20"/>
      <line x1="107" y1="0" x2="107" y2="-10"/>
      <line x1="107" y1="66" x2="107" y2="56"/>
    </g>
    <!-- checkmark badge on a finished worker -->
    <circle cx="140" cy="66" r="12" fill="#10b981"/>
    <path d="M134 66 l4 5 8 -10" fill="none" stroke="#06050d" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Small gear, bottom-left of art -->
  <g transform="translate(452,236)" fill="none" stroke="#94a3b8" stroke-width="2">
    <circle cx="0" cy="0" r="13"/>
    <circle cx="0" cy="0" r="5"/>
    <g stroke-linecap="round">
      <line x1="0" y1="-13" x2="0" y2="-20"/><line x1="0" y1="13" x2="0" y2="20"/>
      <line x1="-13" y1="0" x2="-20" y2="0"/><line x1="13" y1="0" x2="20" y2="0"/>
      <line x1="-9" y1="-9" x2="-14" y2="-14"/><line x1="9" y1="9" x2="14" y2="14"/>
      <line x1="-9" y1="9" x2="-14" y2="14"/><line x1="9" y1="-9" x2="14" y2="-14"/>
    </g>
  </g>

  <text x="400" y="330" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Agentic Skill Library</text>
  <text x="400" y="375" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#c4b5fd">AUTOMATION AS CODE</text>
  <text x="400" y="415" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#94a3b8">Version-controlled AI skills &#8212; autonomous project manager, release runbooks, knowledge graphs</text>
</svg>
