<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="glowET" cx="25%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#3b2405"/>
      <stop offset="55%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#glowET)"/>

  <!-- Endpoint list card -->
  <g>
    <rect x="120" y="66" width="400" height="196" rx="12" fill="#1f2430" stroke="#3a4356" stroke-width="2"/>
    <g font-family="Poppins, Arial, sans-serif" font-size="14">
      <rect x="138" y="84" width="56" height="24" rx="5" fill="#4ade80" opacity="0.2"/>
      <text x="166" y="101" text-anchor="middle" fill="#4ade80" font-weight="600" font-size="12">GET</text>
      <text x="206" y="101" fill="#e2e8f0">/api/expenses</text>

      <rect x="138" y="118" width="56" height="24" rx="5" fill="#fbbf24" opacity="0.2"/>
      <text x="166" y="135" text-anchor="middle" fill="#fbbf24" font-weight="600" font-size="12">POST</text>
      <text x="206" y="135" fill="#e2e8f0">/api/expenses</text>

      <rect x="138" y="152" width="56" height="24" rx="5" fill="#38bdf8" opacity="0.2"/>
      <text x="166" y="169" text-anchor="middle" fill="#38bdf8" font-weight="600" font-size="12">PUT</text>
      <text x="206" y="169" fill="#e2e8f0">/api/expenses/{id}</text>

      <rect x="138" y="186" width="56" height="24" rx="5" fill="#4ade80" opacity="0.2"/>
      <text x="166" y="203" text-anchor="middle" fill="#4ade80" font-weight="600" font-size="12">GET</text>
      <text x="206" y="203" fill="#e2e8f0">/api/summary?month=2026-07</text>

      <rect x="138" y="220" width="56" height="24" rx="5" fill="#fbbf24" opacity="0.2"/>
      <text x="166" y="237" text-anchor="middle" fill="#fbbf24" font-weight="600" font-size="12">POST</text>
      <text x="206" y="237" fill="#e2e8f0">/api/auth/login</text>
    </g>
    <!-- Bearer padlocks on secured rows -->
    <g fill="none" stroke="#fbbf24" stroke-width="2">
      <rect x="482" y="92" width="14" height="11" rx="2"/>
      <path d="M485 92 v-3 a4 4 0 0 1 8 0 v3"/>
      <rect x="482" y="126" width="14" height="11" rx="2"/>
      <path d="M485 126 v-3 a4 4 0 0 1 8 0 v3"/>
      <rect x="482" y="160" width="14" height="11" rx="2"/>
      <path d="M485 160 v-3 a4 4 0 0 1 8 0 v3"/>
      <rect x="482" y="194" width="14" height="11" rx="2"/>
      <path d="M485 194 v-3 a4 4 0 0 1 8 0 v3"/>
    </g>
  </g>

  <!-- Coin with big padlock -->
  <g transform="translate(560,92)">
    <circle cx="70" cy="70" r="64" fill="#1f2430" stroke="#3a4356" stroke-width="2"/>
    <circle cx="70" cy="70" r="46" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.9"/>
    <circle cx="70" cy="70" r="38" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6"/>
    <text x="70" y="86" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="46" font-weight="700" fill="#fbbf24">$</text>
    <!-- small lock resting on the coin -->
    <g transform="translate(102,102)">
      <circle cx="16" cy="16" r="22" fill="#0c1220" stroke="#3a4356" stroke-width="2"/>
      <rect x="7" y="14" width="18" height="14" rx="3" fill="#fbbf24"/>
      <path d="M11 14 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#fbbf24" stroke-width="3"/>
    </g>
  </g>

  <text x="400" y="330" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Expense Tracker API</text>
  <text x="400" y="375" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#fcd34d">YOUR MONEY, YOUR TOKEN</text>
  <text x="400" y="415" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#94a3b8">JWT-secured personal-finance REST API &#8212; ASP.NET Core 8 &amp; EF Core</text>
</svg>
