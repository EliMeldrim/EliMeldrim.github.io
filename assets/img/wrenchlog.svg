<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="glowWL" cx="25%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#2d1e05"/>
      <stop offset="55%" stop-color="#141008"/>
      <stop offset="100%" stop-color="#07060d"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#glowWL)"/>

  <!-- Car silhouette -->
  <g fill="none" stroke="#3a4356" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 210 q18 -44 62 -52 l58 -10 q40 -28 92 -28 l58 0 q46 4 72 34 l26 30 q40 6 52 26 l4 20 -22 4"/>
    <path d="M130 210 l-14 6 4 22 30 2"/>
    <line x1="212" y1="242" x2="378" y2="242"/>
    <path d="M256 152 l-6 44 M330 122 l0 72 M402 124 l16 68"/>
  </g>
  <!-- Wheels -->
  <g>
    <circle cx="181" cy="242" r="32" fill="#1f2430" stroke="#3a4356" stroke-width="3"/>
    <circle cx="181" cy="242" r="12" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="410" cy="242" r="32" fill="#1f2430" stroke="#3a4356" stroke-width="3"/>
    <circle cx="410" cy="242" r="12" fill="none" stroke="#fbbf24" stroke-width="3"/>
  </g>

  <!-- Wrench crossing a maintenance checklist -->
  <g transform="translate(540,80)">
    <rect x="0" y="0" width="170" height="190" rx="12" fill="none" stroke="#3a4356" stroke-width="2"/>
    <line x1="0" y1="38" x2="170" y2="38" stroke="#3a4356" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
      <line x1="46" y1="66" x2="150" y2="66"/>
      <line x1="46" y1="100" x2="150" y2="100"/>
      <line x1="46" y1="134" x2="150" y2="134"/>
      <line x1="46" y1="168" x2="150" y2="168"/>
    </g>
    <!-- checkmarks -->
    <g stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M18 64 l6 7 11 -13"/>
      <path d="M18 98 l6 7 11 -13"/>
    </g>
    <!-- pending circles -->
    <circle cx="26" cy="132" r="8" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="26" cy="166" r="8" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <!-- odometer strip in header -->
    <g font-family="Poppins, Arial, sans-serif" font-size="16" fill="#fbbf24" text-anchor="middle">
      <text x="85" y="26">0 8 4 3 2 7</text>
    </g>
  </g>
  <!-- Wrench overlay -->
  <g transform="translate(452,244) rotate(-32)">
    <path d="M0 0 a20 20 0 1 1 14 -34 l-8 10 4 12 12 4 10 -8 a20 20 0 0 1 -32 16 z M8 -6 l86 62 a12 12 0 1 1 -14 18 a12 12 0 0 1 2 -16 z"
          fill="#fbbf24" opacity="0.9"/>
  </g>

  <text x="400" y="330" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">WrenchLog</text>
  <text x="400" y="375" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#fbbf24">EVERY MILE MAINTAINED</text>
  <text x="400" y="415" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#94a3b8">Car-maintenance tracker with AI service schedules &#8212; TypeScript monorepo, Express &amp; React</text>
</svg>
