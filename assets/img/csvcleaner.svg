<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="glowCC" cx="25%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#1a2e05"/>
      <stop offset="55%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#glowCC)"/>

  <!-- Messy table -->
  <g>
    <rect x="120" y="78" width="220" height="176" rx="10" fill="#1f2430" stroke="#3a4356" stroke-width="2"/>
    <g stroke="#2b3145" stroke-width="1.5">
      <line x1="120" y1="112" x2="340" y2="112"/>
      <line x1="120" y1="148" x2="340" y2="148"/>
      <line x1="120" y1="184" x2="340" y2="184"/>
      <line x1="120" y1="220" x2="340" y2="220"/>
      <line x1="196" y1="78" x2="196" y2="254"/>
      <line x1="268" y1="78" x2="268" y2="254"/>
    </g>
    <!-- crooked header -->
    <g transform="translate(132,90) rotate(-3)">
      <rect x="0" y="0" width="50" height="9" rx="4.5" fill="#94a3b8" opacity="0.8"/>
    </g>
    <rect x="206" y="90" width="40" height="9" rx="4.5" fill="#94a3b8" opacity="0.5"/>
    <rect x="278" y="93" width="50" height="9" rx="4.5" fill="#94a3b8" opacity="0.65"/>
    <!-- messy cells: nulls, bad values, duplicate rows -->
    <g font-family="Poppins, Arial, sans-serif" font-size="12">
      <rect x="132" y="124" width="44" height="9" rx="4.5" fill="#e2e8f0" opacity="0.5"/>
      <text x="206" y="134" fill="#f87171">NULL</text>
      <rect x="278" y="124" width="36" height="9" rx="4.5" fill="#e2e8f0" opacity="0.5"/>
      <text x="132" y="170" fill="#f87171">"  42 "</text>
      <rect x="206" y="160" width="40" height="9" rx="4.5" fill="#e2e8f0" opacity="0.5"/>
      <text x="278" y="170" fill="#f87171">1/2/26?</text>
      <!-- duplicate rows highlighted -->
      <rect x="126" y="190" width="208" height="26" rx="4" fill="#f87171" opacity="0.12"/>
      <rect x="126" y="222" width="208" height="26" rx="4" fill="#f87171" opacity="0.12"/>
      <rect x="132" y="198" width="44" height="9" rx="4.5" fill="#e2e8f0" opacity="0.5"/>
      <rect x="206" y="198" width="40" height="9" rx="4.5" fill="#e2e8f0" opacity="0.5"/>
      <rect x="278" y="198" width="36" height="9" rx="4.5" fill="#e2e8f0" opacity="0.5"/>
      <rect x="132" y="230" width="44" height="9" rx="4.5" fill="#e2e8f0" opacity="0.5"/>
      <rect x="206" y="230" width="40" height="9" rx="4.5" fill="#e2e8f0" opacity="0.5"/>
      <rect x="278" y="230" width="36" height="9" rx="4.5" fill="#e2e8f0" opacity="0.5"/>
    </g>
  </g>

  <!-- Pipeline arrow -->
  <g>
    <path d="M356 166 h72" stroke="#a3e635" stroke-width="4" stroke-linecap="round"/>
    <path d="M436 166 l-14 -9 v18 z" fill="#a3e635"/>
    <text x="394" y="150" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#a3e635">PIPELINE</text>
  </g>

  <!-- Clean table -->
  <g>
    <rect x="456" y="78" width="220" height="176" rx="10" fill="#1f2430" stroke="#a3e635" stroke-width="2"/>
    <rect x="456" y="78" width="220" height="34" rx="10" fill="#a3e635" opacity="0.16"/>
    <g stroke="#2b3145" stroke-width="1.5">
      <line x1="456" y1="112" x2="676" y2="112"/>
      <line x1="456" y1="148" x2="676" y2="148"/>
      <line x1="456" y1="184" x2="676" y2="184"/>
      <line x1="456" y1="220" x2="676" y2="220"/>
      <line x1="532" y1="78" x2="532" y2="254"/>
      <line x1="604" y1="78" x2="604" y2="254"/>
    </g>
    <g fill="#a3e635">
      <rect x="468" y="90" width="50" height="9" rx="4.5" opacity="0.9"/>
      <rect x="542" y="90" width="40" height="9" rx="4.5" opacity="0.9"/>
      <rect x="614" y="90" width="50" height="9" rx="4.5" opacity="0.9"/>
    </g>
    <g fill="#e2e8f0">
      <rect x="468" y="124" width="44" height="9" rx="4.5" opacity="0.7"/>
      <rect x="542" y="124" width="40" height="9" rx="4.5" opacity="0.7"/>
      <rect x="614" y="124" width="36" height="9" rx="4.5" opacity="0.7"/>
      <rect x="468" y="160" width="44" height="9" rx="4.5" opacity="0.7"/>
      <rect x="542" y="160" width="40" height="9" rx="4.5" opacity="0.7"/>
      <rect x="614" y="160" width="36" height="9" rx="4.5" opacity="0.7"/>
      <rect x="468" y="196" width="44" height="9" rx="4.5" opacity="0.7"/>
      <rect x="542" y="196" width="40" height="9" rx="4.5" opacity="0.7"/>
      <rect x="614" y="196" width="36" height="9" rx="4.5" opacity="0.7"/>
    </g>
    <path d="M614 228 l7 8 l14 -16" stroke="#a3e635" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="400" y="330" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="50" font-weight="700" fill="#ffffff">CSV Data Cleaner</text>
  <text x="400" y="375" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#bef264">MESS IN, TIDY OUT</text>
  <text x="400" y="415" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#94a3b8">Composable cleaning pipelines with live diffs &#8212; FastAPI &amp; pandas</text>
</svg>
